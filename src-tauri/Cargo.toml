[package]
name = "narra"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP for the Apps Script API and the holiday list (runs off the main thread).
ureq = { version = "2", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Pin the desktop widget into the desktop layer (like macOS widgets).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }

[profile.release]
strip = true
